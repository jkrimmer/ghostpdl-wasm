name: "Release: build all ghostpdl binaries for wasm"
on: 
  push:
    tags:
    - 'v*'
    - 'gs*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.14
          actions-cache-folder: emsdk-cache
      
      - name: Verify
        run: emcc -v

      - name: Checkout ghostpdl submodule at version from setup.sh
        run: |
          GSVER=$(grep '^GSVER=' build/setup.sh | cut -d= -f2)
          TAG=""
          for candidate in "gs${GSVER}" "ghostpdl-${GSVER}"; do
            if git -C build/ghostpdl ls-remote --exit-code --tags origin "refs/tags/${candidate}" >/dev/null; then
              TAG="${candidate}"
              break
            fi
          done

          if [ -z "$TAG" ]; then
            echo "No matching ghostpdl tag found for GSVER=${GSVER}" >&2
            exit 1
          fi

          git -C build/ghostpdl fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git -C build/ghostpdl checkout "tags/${TAG}"

      - name: Build ghostpdl for wasm
        run: ./build/build.sh

      - name: Zip generated binaries
        run: |
          mkdir target
          cd build/ghostpdl/bin
          for base in $(ls | sed -e 's/\.[^.]*$//' | sort -u); do tar -cvf "$base.tar" $(ls "$base"*); gzip "$base.tar"; done
          mv *.tar.gz ../../../target          

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/*
          tag: ${{ github.ref }}
          release_name: ${{ github.ref_name }}
          overwrite: true
          file_glob: true
